<!-- Hero — molde de largura total, sem selos nem CTAs, como no mockup.
     A camada é um gradiente da esquerda para a direita: escurece o lado do texto
     e deixa a sala de formação visível do outro lado. -->
<app-container-banner-faixa-estatistica>
  <app-banner-destaque [titulo]="tituloHero()" [tituloDestaque]="tituloDestaqueHero()" [subtitulo]="subtituloHero()"
    bg="/imagens/bg-banner-formacoes.png" [temBackdrop]="true"
    classeBackdrop="bg-gradient-to-r from-black/70 via-black/45 to-black/10" />
</app-container-banner-faixa-estatistica>
