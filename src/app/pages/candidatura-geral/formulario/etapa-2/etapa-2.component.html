<form [formGroup]="estado.formacao" class="flex flex-col gap-8" novalidate>
  <!-- Os blocos ficam dentro de @if para já apanharem o [formGroup] ligado —
       ver criarErrosFormulario. -->
  @if (estado.formacao) {
    <section id="secao-formacao" class="rounded-2xl border border-gray-100 bg-white p-6 shadow-sm sm:p-10">
      <app-etapa-2-formacao-academica />
    </section>

    <!-- Secções 2 e 3 no mesmo cartão, como no mockup. -->
    <section id="secao-experiencia" class="flex flex-col gap-12 rounded-2xl border border-gray-100 bg-white p-6 shadow-sm sm:p-10">
      <app-etapa-2-experiencia-docente />
      <app-etapa-2-experiencia />
    </section>
  }
</form>
