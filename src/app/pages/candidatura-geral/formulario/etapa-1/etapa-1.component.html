<form [formGroup]="estado.dados" class="flex flex-col gap-5 sm:gap-8" novalidate>
  <!-- Os blocos ficam dentro de @if para já apanharem o [formGroup] ligado —
       ver criarErrosFormulario. -->
  @if (estado.dados) {
    <!-- No telemóvel só 4px de cada lado, para os campos ganharem largura. -->
    <section id="secao-dados-pessoais" class="rounded-2xl border border-gray-100 bg-white p-1 shadow-sm sm:p-10">
      <app-etapa-1-dados-pessoais />
    </section>

    @if (estado.ehDocente()) {
      <section id="secao-area" class="rounded-2xl border border-gray-100 bg-white p-1 shadow-sm sm:p-10">
        <app-etapa-1-area-candidatura />
      </section>
    } @else {
      <section id="secao-funcao" class="rounded-2xl border border-gray-100 bg-white p-4 shadow-sm sm:p-10">
        <app-etapa-1-funcao-candidatura />
      </section>
    }
  }
</form>
