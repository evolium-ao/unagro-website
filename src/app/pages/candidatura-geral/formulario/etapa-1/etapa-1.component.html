<form [formGroup]="estado.dados" class="flex flex-col gap-8" novalidate>
  <!-- Os blocos ficam dentro de @if para já apanharem o [formGroup] ligado —
       ver criarErrosFormulario. -->
  @if (estado.dados) {
    <section id="secao-dados-pessoais" class="rounded-2xl border border-gray-100 bg-white p-6 shadow-sm sm:p-10">
      <app-etapa-1-dados-pessoais />
    </section>

    <section id="secao-area" class="rounded-2xl border border-gray-100 bg-white p-6 shadow-sm sm:p-10">
      <app-etapa-1-area-candidatura />
    </section>
  }
</form>
