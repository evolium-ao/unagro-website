<div class="mx-auto max-w-lg overflow-x-auto">
  <app-passos-formulario
    class="block min-w-[300px]"
    formaDistintivo="circulo"
    [passos]="rotulosPassos()"
    [ativo]="passoAtual()"
    [rotuloLista]="textos().progresso" />
</div>

@if (submetido()) {
<!-- Confirmação: só aparece depois de o POST /candidaturas/aluno passar. -->
<div class="mt-10 flex flex-col items-center rounded-2xl border border-gray-200 bg-white p-6 py-12 text-center shadow-sm sm:p-8 lg:p-12">
  <span class="flex h-14 w-14 items-center justify-center rounded-full bg-primary/10 text-primary">
    <app-icone nome="circle-check" [tamanho]="28" />
  </span>
  <h3 class="mt-5 text-xl font-bold text-primary-dark">
    {{ textos().sucessoTitulo }}
  </h3>
  <p class="mt-3 max-w-md text-sm leading-relaxed text-text-secondary">
    {{ textos().sucessoDescricao }}
  </p>
  <app-botao class="mt-7" variante="contorno" (clicado)="recomecar()">
    {{ textos().sucessoBotao }}
  </app-botao>
</div>
} @else {
<form
  class="mt-10 rounded-2xl border border-gray-200 bg-white p-6 shadow-sm sm:p-8 lg:p-10"
  [formGroup]="formulario"
  (ngSubmit)="submeter()">
  <app-inscricao-dados-pessoais />

  <div class="mt-12">
    <app-inscricao-formacao-academica [cursos]="opcoesCursos()" />
  </div>

  <div class="mt-12">
    <app-inscricao-motivacao-documentos />
  </div>

  <!-- A falha do POST fica aqui, e não num modal: o formulário continua
       preenchido e a candidatura repete-se com um clique. -->
  @if (enviar.isError()) {
  <p role="alert"
    class="mt-8 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm leading-relaxed text-red-700">
    {{ mensagemErro() }}
  </p>
  }

  <div class="mt-10 flex justify-end">
    <app-botao
      variante="primario"
      raio="medio"
      tipo="submit"
      icone="arrow-right"
      posicaoIcone="direita"
      [aCarregar]="enviar.isPending()"
      [desativado]="enviar.isPending()">
      {{ textos().avancar }}
    </app-botao>
  </div>
</form>
}
