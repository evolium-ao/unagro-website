<!-- Página de entrada — cartão de duas metades: marca à esquerda, formulário à direita. -->
<section class="flex flex-1 items-center justify-center px-4 py-16 sm:px-6">
  <div
    class="w-full max-w-3xl overflow-hidden rounded-xl bg-white shadow-2xl shadow-black/30"
    appRevelarAoScroll
  >
    <div class="grid sm:grid-cols-2">
      <app-painel-marca-autenticacao
        class="min-h-72"
        imagemFundo="/imagens/bg-banner-formacoes.png"
        icone="/imagens/livro-login.svg"
        [titulo]="tituloPainel()"
        [subtitulo]="subtituloPainel()"
        [descricao]="descricaoPainel()"
      />

      <div class="flex flex-col">
        <div class="flex flex-1 flex-col px-8 py-9">
          <img
            src="/imagens/unagro-logo.png"
            [alt]="altLogo()"
            width="56"
            height="56"
            class="mx-auto size-14 object-contain"
          />

          <form [formGroup]="formulario" (ngSubmit)="submeter()" class="mt-8">
            <form-input-field
              class="block"
              variante="sublinhado"
              [ocultarRotuloVazio]="true"
              type="email"
              formControlName="email"
              [placeholder]="placeholderEmail()"
              [erro]="validacao.getErro('email')"
            >
              <app-icone leftIcon nome="at-sign" [tamanho]="16" />
            </form-input-field>

            <form-input-field
              class="mt-3 block"
              variante="sublinhado"
              [ocultarRotuloVazio]="true"
              type="password"
              formControlName="palavraPasse"
              [placeholder]="placeholderPalavraPasse()"
              [erro]="validacao.getErro('palavraPasse')"
            >
              <app-icone leftIcon nome="lock" [tamanho]="16" />
            </form-input-field>

            <div class="mt-1 flex items-center justify-between gap-3">
              <label class="flex cursor-pointer items-center gap-2">
                <input
                  type="checkbox"
                  formControlName="lembrar"
                  class="size-3.5 shrink-0 cursor-pointer appearance-none rounded-full border border-gray-300 bg-white transition-colors duration-200 checked:border-primary checked:bg-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40 focus-visible:ring-offset-1"
                />
                <span class="text-xs text-text-secondary">{{ rotuloLembrar() }}</span>
              </label>

              <!-- TODO: falta a página de recuperação de palavra-passe; até existir, a
                   ligação fica na própria página em vez de apontar para uma rota inventada. -->
              <a
                href="#entrar"
                class="text-xs font-semibold text-primary hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2"
              >
                {{ rotuloEsqueci() }}
              </a>
            </div>

            @if (mensagemFalha(); as mensagem) {
              <p
                class="mt-4 rounded-lg bg-red-50 px-3 py-2 text-xs text-red-700"
                role="alert"
                aria-live="polite"
              >
                {{ mensagem }}
              </p>
            }

            <app-botao
              class="mt-5 block"
              tipo="submit"
              variante="primario"
              raio="medio"
              [larguraTotal]="true"
              [aCarregar]="entrar.isPending()"
            >
              {{ rotuloEntrar() }}
            </app-botao>
          </form>

          <app-separador-texto class="mt-7" [texto]="textoSeparador()" />

          <div class="mt-5 grid grid-cols-2 gap-3">
            <app-botao-social
              icone="/imagens/google.svg"
              rotulo="Google"
              [desativado]="entrar.isPending()"
              (clicado)="entrarCom('google')"
            />
            <app-botao-social
              icone="/imagens/microsoft.svg"
              rotulo="Office 365"
              [desativado]="entrar.isPending()"
              (clicado)="entrarCom('office365')"
            />
          </div>
        </div>

        <p
          class="bg-bg-light px-4 py-3 text-center text-[10px] uppercase tracking-[0.08em] text-text-secondary"
        >
          {{ rotuloDireitos() }}
        </p>
      </div>
    </div>
  </div>
</section>
