<!-- Hero — evento em destaque, com o realce dourado no meio do título (tituloFim). -->
<app-container-banner-faixa-estatistica>
  <app-banner-destaque [titulo]="tituloHero()" [tituloDestaque]="tituloHeroDestaque()" [tituloFim]="tituloHeroFim()"
    [subtitulo]="subtituloHero()" [ctas]="ctasHero()" bg="/imagens/bg-banner-eventos.png" [temBackdrop]="true" />
</app-container-banner-faixa-estatistica>

<!-- 1 sessão — Próximos Eventos: filtros por âmbito à esquerda, grelha paginada à direita -->
<section id="secao-proximos-eventos" class="bg-bg-lighter px-4 py-16 sm:px-6 sm:py-20 lg:px-8">
  <app-container-pagina>
    <div class="grid gap-10 lg:grid-cols-[240px_1fr]">
      <aside>
        <p class="px-3 text-[10px] font-semibold uppercase tracking-widest text-text-secondary">
          {{ rotuloFiltros() }}
        </p>
        <div class="mt-4 flex flex-col gap-1">
          @for (filtro of filtros(); track filtro.valor) {
          <app-item-filtro-lateral [rotulo]="filtro.rotulo" [icone]="filtro.icone"
            [ativo]="ambitoSelecionado() === filtro.valor" (selecionado)="selecionarAmbito(filtro.valor)" />
          }
        </div>
      </aside>

      <div>
        <div class="flex flex-wrap items-start justify-between gap-4">
          <app-cabecalho-secao [titulo]="tituloSecao()" [descricao]="descricaoSecao()" alinhamento="esquerda"
            [mostrarTracos]="false" />

          <div class="flex items-center gap-1">
            <button type="button"
              class="inline-flex h-8 w-8 cursor-pointer items-center justify-center rounded-full border border-gray-200 bg-white text-text-secondary transition-colors duration-200 hover:border-primary hover:text-primary disabled:cursor-not-allowed disabled:opacity-40"
              [disabled]="!temAnteriores()" [attr.aria-label]="rotuloAnterior()" (click)="anteriores()">
              <app-icone nome="chevron-left" [tamanho]="16" />
            </button>
            <button type="button"
              class="inline-flex h-8 w-8 cursor-pointer items-center justify-center rounded-full border border-gray-200 bg-white text-text-secondary transition-colors duration-200 hover:border-primary hover:text-primary disabled:cursor-not-allowed disabled:opacity-40"
              [disabled]="!temSeguintes()" [attr.aria-label]="rotuloSeguinte()" (click)="seguintes()">
              <app-icone nome="chevron-right" [tamanho]="16" />
            </button>
          </div>
        </div>

        @if (eventoDestacado(); as destacado) {
        <div class="mt-8 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
          <div class="sm:col-span-2" [appRevelarAoScroll]="0">
            <app-cartao-evento-foto [evento]="destacado" formato="destaque" />
          </div>

          @for (evento of eventosSecundarios(); track evento.id) {
          <app-cartao-evento-foto [evento]="evento" [appRevelarAoScroll]="$index + 1" />
          }
        </div>
        } @else {
        <p class="mt-8 py-12 text-center text-sm text-text-secondary">{{ semEventos() }}</p>
        }
      </div>
    </div>
  </app-container-pagina>
</section>

<!-- 2 sessão — A Autoridade de uma Certificação UNAGRO: três pilares sobre fundo verde -->
<section id="secao-autoridade-certificacao"
  class="relative overflow-hidden bg-primary-dark px-4 py-16 sm:px-6 sm:py-20 lg:px-8">
  <!-- Marca de água: o selo de certificação, cortado no canto superior direito como no mockup. -->
  <svg class="pointer-events-none absolute -top-12 -right-6 h-70 w-72 text-white opacity-5 lg:h-105 lg:w-110"
    viewBox="0 0 275 263" fill="none" aria-hidden="true">
    <path
      d="M95 262.5L71.25 222.5L26.25 212.5L30.625 166.25L0 131.25L30.625 96.25L26.25 50L71.25 40L95 0L137.5 18.125L180 0L203.75 40L248.75 50L244.375 96.25L275 131.25L244.375 166.25L248.75 212.5L203.75 222.5L180 262.5L137.5 244.375L95 262.5ZM105.625 230.625L137.5 216.875L170 230.625L187.5 200.625L221.875 192.5L218.75 157.5L241.875 131.25L218.75 104.375L221.875 69.375L187.5 61.875L169.375 31.875L137.5 45.625L105 31.875L87.5 61.875L53.125 69.375L56.25 104.375L33.125 131.25L56.25 157.5L53.125 193.125L87.5 200.625L105.625 230.625ZM124.375 175.625L195 105L177.5 86.875L124.375 140L97.5 113.75L80 131.25L124.375 175.625Z"
      fill="currentColor" />
  </svg>

  <app-container-pagina class="relative z-10">
    <app-cabecalho-secao [titulo]="tituloCertificacao()" [descricao]="descricaoCertificacao()" tema="branco"
      [mostrarTracos]="false" />

    <div class="mt-14 grid gap-12 sm:grid-cols-3 sm:gap-8">
      @for (pilar of pilaresCertificacao(); track pilar.id) {
      <app-pilar-icone [icone]="pilar.icone" [titulo]="pilar.titulo" [descricao]="pilar.descricao"
        [appRevelarAoScroll]="$index" />
      }
    </div>
  </app-container-pagina>
</section>
